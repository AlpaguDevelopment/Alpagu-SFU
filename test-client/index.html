<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Alpagu-SFU Test Client</title>
  </head>
  <body>
    <main id="lobby" class="lobby">
      <h1>Alpagu-SFU Test Client</h1>
      <p class="muted">v0.1: one room, two-way audio. Camera is a local preview only.</p>
      <label for="name">Your name</label>
      <input id="name" maxlength="32" autocomplete="nickname" placeholder="e.g. Alex" />
      <button id="join" class="primary">Join</button>
      <p id="lobby-error" class="error" hidden></p>
      <p class="muted small" id="versions"></p>
    </main>

    <section id="room" class="room" hidden>
      <header class="topbar">
        <span id="status" class="status">Connecting…</span>
        <span id="count" class="muted small"></span>
      </header>

      <button id="unlock-audio" class="banner" hidden>Tap to enable audio</button>

      <div id="grid" class="grid"></div>

      <nav class="controls">
        <button id="btn-mic" class="ctrl">Microphone</button>
        <button id="btn-cam" class="ctrl">Camera</button>
        <button id="btn-deaf" class="ctrl">Deafen</button>
        <button id="btn-leave" class="ctrl danger">Leave</button>
      </nav>
      <p id="camera-status" class="muted small" role="status"></p>

    </section>

      <details class="logwrap">
        <summary>Log</summary>
        <pre id="log" class="log"></pre>
      </details>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
